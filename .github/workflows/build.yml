name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore:
      - "تطبيقات/**"
  pull_request:
  workflow_dispatch:

jobs:
  desktop-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests
        env:
          QT_QPA_PLATFORM: offscreen

  mobile:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # مفتاح توقيع ثابت (من أسرار المستودع) حتى يتحدّث التطبيق فوق النسخة السابقة بدل رفض التثبيت
      - name: Android signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=upload"
              echo "storeFile=upload-keystore.jks"
            } > android/key.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::لم تُضف أسرار مفتاح التوقيع (ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD): لن يُنشر ملف APK في مجلد تطبيقات"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: FaroukToumma-android
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    needs: desktop-tests
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pyinstaller --noconfirm ft_trading.spec
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\FaroukToumma.iss
      - uses: actions/upload-artifact@v4
        with:
          name: FaroukToumma-windows
          path: desktop/dist/FaroukToumma
      - uses: actions/upload-artifact@v4
        with:
          name: FaroukToumma-setup
          path: desktop/installer/Output/FaroukToumma-Setup.exe

  publish:
    # يضع ملفات التثبيت الجاهزة في مجلد «تطبيقات» داخل المستودع
    if: github.event_name == 'push' && github.ref_type == 'branch'
    needs: [mobile, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: _artifacts
      - name: Copy into تطبيقات
        run: |
          mkdir -p "تطبيقات/ويندوز" "تطبيقات/اندرويد"
          cp _artifacts/FaroukToumma-setup/FaroukToumma-Setup.exe "تطبيقات/ويندوز/FaroukToumma-Setup.exe"
          if [ "${{ needs.mobile.outputs.signed }}" = "true" ]; then
            cp _artifacts/FaroukToumma-android/app-release.apk "تطبيقات/اندرويد/FaroukToumma.apk"
          else
            echo "::warning::ملف APK غير موقّع بالمفتاح الثابت، لم يُنشر"
          fi
          rm -rf _artifacts
          ls -la تطبيقات/*
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "تطبيقات"
          git diff --cached --quiet && exit 0
          git commit -m "تحديث ملفات التثبيت (${GITHUB_SHA::7}) [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mobile, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - run: mv FaroukToumma-setup/FaroukToumma-Setup.exe . && mv FaroukToumma-android/app-release.apk FaroukToumma.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            FaroukToumma-Setup.exe
            FaroukToumma.apk
