name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  desktop-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests
        env:
          QT_QPA_PLATFORM: offscreen

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: FaroukToumma-android
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    needs: desktop-tests
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pyinstaller --noconfirm ft_trading.spec
      - uses: actions/upload-artifact@v4
        with:
          name: FaroukToumma-windows
          path: desktop/dist/FaroukToumma

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mobile, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - run: cd FaroukToumma-windows && zip -qr ../FaroukToumma-windows.zip . && cd .. && mv FaroukToumma-android/app-release.apk FaroukToumma.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            FaroukToumma-windows.zip
            FaroukToumma.apk
